{% extends "base.html" %}

{% block title %}Série de code{% endblock %}

{% block content %}
    <h1 class="h3 fw-bold mb-4">Série de questions</h1>

    <div class="card form-card-lg">
        <div class="card-body">
            <form method="post" novalidate>
                {% csrf_token %}
                {{ form.non_field_errors }}

                <div class="mb-3">
                    <label class="form-label fw-semibold">Titre</label>
                    {{ form.title }}
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Description</label>
                    {{ form.description }}
                </div>

                <div class="form-check mb-3">
                    {{ form.is_published }}
                    <label class="form-check-label">Publié</label>
                </div>

                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a href="{% url 'code-series-list' %}" class="btn btn-outline-secondary">Annuler</a>
            </form>
        </div>
    </div>
{% endblock %}
