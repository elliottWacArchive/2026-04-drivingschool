{% extends "base.html" %} {% block title %}Confirmer la suppression{% endblock
%} {% block content %}
<div
    class="d-flex justify-content-center align-items-center"
    style="min-height: 60vh"
>
    <div class="card text-center" style="max-width: 480px; width: 100%">
        <div class="card-body p-5">
            <div class="text-danger mb-3">
                <i
                    class="bi bi-exclamation-triangle-fill"
                    style="font-size: 3rem"
                ></i>
            </div>
            <h4 class="fw-bold mb-2">Confirmer la suppression</h4>
            <p class="text-muted mb-4">
                Êtes-vous sûr de vouloir supprimer
                <strong>{{ object }}</strong> ? Cette action est irréversible.
            </p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-3 justify-content-center">
                    <button type="submit" class="btn btn-danger px-4">
                        Oui, supprimer
                    </button>
                    <a
                        href="javascript:history.back()"
                        class="btn btn-outline-secondary px-4"
                        >Annuler</a
                    >
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
